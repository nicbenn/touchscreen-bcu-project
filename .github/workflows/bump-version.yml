name: Bump version

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bump software_version
        id: bump
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          python scripts/bump_version.py --apply --git-range "$BEFORE" | tee bump-out.txt
          OUT="$(tr -d '\r' < bump-out.txt | tail -n 1)"
          echo "result=$OUT" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- config.yaml bcu/__init__.py; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push version
        if: steps.bump.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.yaml bcu/__init__.py
          git commit -m "chore: bump version to ${{ steps.bump.outputs.result }}"
          git push
